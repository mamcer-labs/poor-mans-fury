apiVersion: v1
kind: ServiceAccount
metadata:
  name: cookbook
  namespace: fury-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook
  namespace: fury-dev
  labels:
    fury/app: cookbook
    fury/scope: dev
    backstage.io/kubernetes-id: cookbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cookbook
  template:
    metadata:
      labels:
        app: cookbook
        backstage.io/kubernetes-id: cookbook
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "cookbook-dev"
        vault.hashicorp.com/agent-inject-secret-config: "fury/data/apps/cookbook/dev/config"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "fury/data/apps/cookbook/dev/config" -}}
          # TODO: agregar los export reales de esta app, ver README del repo
          {{- end -}}
    spec:
      serviceAccountName: cookbook
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: cookbook
          image: ghcr.io/mamcer-labs/cookbook:latest
          command: ["sh", "-c", "source /vault/secrets/config && exec /app/app-bin"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook
  namespace: fury-dev
  labels:
    app: cookbook
    backstage.io/kubernetes-id: cookbook
spec:
  selector:
    app: cookbook
  ports:
    - port: 8080
      targetPort: 8080
