# Immich: self-hosted photo and video library for the household (LAN only).
# Like Navidrome, not a Fury app: it lives in the `media` namespace
# (declared in navidrome.yaml), outside the scopes, and doesn't go through
# pmf, Backstage or CI.
#
# Translated 1:1 from the official docker-compose.yml of the pinned release
# (v3.4.1): server, machine learning, Postgres with VectorChord, Valkey.
# Images are pinned; upgrade by reading the release notes first (Immich
# ships breaking migrations).
#
# The archive (picture/ + video/) is read straight from the backup disk,
# read-only, as External Libraries. Immich writes its data folder (uploads,
# thumbnails, encoded video, DB dumps) to homunculus/immich/ on the same
# disk; only Postgres and the model cache stay on PVCs on the system disk.
#
# Needs the containerd AppArmor profile in ../apparmor/ on the host:
# without it Postgres can't signal its own processes and never starts.
#
# The DB password is not in git. Create it once before applying:
#   kubectl -n media create secret generic immich-db \
#     --from-literal=password="$(openssl rand -hex 24)"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: media
  labels:
    app: immich-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      # Start directly as the image's postgres user (999): no root, and the
      # entrypoint doesn't need gosu to drop privileges.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdir: the PVC root isn't empty-safe for initdb
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "immich"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi         # building the vector indexes (clip, faces) OOMed at 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres
        - name: shm             # compose: shm_size 128mb
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: media
spec:
  selector:
    app: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  namespace: media
  labels:
    app: immich-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-valkey
  template:
    metadata:
      labels:
        app: immich-valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: media
spec:
  selector:
    app: immich-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: media
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.1
          env:
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: /cache
          ports:
            - name: http
              containerPort: 3003
          volumeMounts:
            - name: cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"          # half the NUC: the first full pass takes days, keep the rest responsive
              memory: 4Gi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: media
spec:
  selector:
    app: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: media
  labels:
    app: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.4.1
          env:
            - name: TZ
              value: America/Argentina/Buenos_Aires
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_USERNAME
              value: postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
          ports:
            - name: http
              containerPort: 2283
          volumeMounts:
            - name: data
              mountPath: /data
            - name: picture
              mountPath: /mnt/archive/picture
              readOnly: true
            - name: video
              mountPath: /mnt/archive/video
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"          # thumbnail and video jobs; same reason as ML
              memory: 3Gi
      volumes:
        # Uploads, thumbs, encoded video and Immich's own DB dumps live on
        # homunculus so the disk backups cover them. Postgres stays on the
        # NVMe (live DB files aren't rsync-safe; the dumps are).
        - name: data
          hostPath:
            path: /run/media/mario/homunculus/immich
            type: Directory
        # LUKS disk, unlocked by udisks on desktop login. type: Directory
        # keeps the pod in ContainerCreating until the disk is mounted,
        # so nothing is ever written to the empty mountpoint on the NVMe.
        - name: picture
          hostPath:
            path: /run/media/mario/homunculus/picture
            type: Directory
        - name: video
          hostPath:
            path: /run/media/mario/homunculus/video
            type: Directory
---
# LoadBalancer (K3s servicelb) so phone apps reach 192.168.100.100:2283:
# Android and iOS don't read /etc/hosts, so *.fury.local won't resolve there.
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`photos.fury.local`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
