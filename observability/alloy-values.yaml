# Grafana Alloy as the log collector, replacing Promtail (EOL 02/03/2026).
# NOT APPLIED YET: see alloy-tempo-migration.md for the cutover steps.
#
#   helm upgrade --install alloy grafana/alloy --version 1.16.0 \
#     -n fury-monitoring -f observability/alloy-values.yaml
#
# The pipeline reproduces the Promtail chart's kubernetes-pods job, so the
# Loki streams keep the same labels (app, component, container, filename,
# instance, job, namespace, node_name, pod, stream) and existing queries
# like {namespace="fury-dev"} keep working.
#
# It tails the files under /var/log/pods (like Promtail) instead of using
# loki.source.kubernetes, which streams every log through the API server.
alloy:
  mounts:
    varlog: true            # /var/log/pods, read-only
  # Without these, the pod is BestEffort and the first one the OOM killer
  # picks (see the gnome-shell leak in stash/pmf.md).
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      // Single-node cluster: every pod is on rathma, so there is no need to
      // filter the discovery by node.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Same relabeling as the Promtail chart (6.17.1).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_controller_name"]
          regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
          target_label  = "__tmp_controller_name"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__tmp_controller_name",
            "__meta_kubernetes_pod_name",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "app"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
            "__meta_kubernetes_pod_label_instance",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "instance"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_component",
            "__meta_kubernetes_pod_label_component",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["namespace", "app"]
          separator     = "/"
          target_label  = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
        // Static pods (k3s has none today, kept for parity with Promtail).
        rule {
          source_labels = [
            "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
            "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
            "__meta_kubernetes_pod_container_name",
          ]
          separator    = "/"
          regex        = "true/(.*)"
          replacement  = "/var/log/pods/*$1/*.log"
          target_label = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
        // Alloy doesn't read Promtail's positions file. Without this, the
        // first start re-sends every log still on disk (duplicates in Loki,
        // and "entry too far behind" rejections for the oldest lines).
        tail_from_end = true
      }

      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // Loki runs with auth_enabled: true, so every push needs the tenant.
      // Missing it is what kept Promtail's logs out of Loki until 18/11/2026.
      loki.write "default" {
        endpoint {
          url       = "http://loki-gateway.fury-monitoring.svc.cluster.local/loki/api/v1/push"
          tenant_id = "poor-mans-fury"
        }
      }

controller:
  type: daemonset
