apiVersion: v1
data:
  gostalgia-red.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate (by route)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (route) (rate(gostalgia_http_requests_total[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error Rate % (by route)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (route) (rate(gostalgia_http_requests_total{status=~\"5..\"}[$__rate_interval])) / sum by (route) (rate(gostalgia_http_requests_total[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency percentiles (by route)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.50, sum by (le, route) (rate(gostalgia_http_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p50 {{route}}"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(gostalgia_http_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95 {{route}}"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, sum by (le, route) (rate(gostalgia_http_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99 {{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests by status code",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status) (rate(gostalgia_http_requests_total[$__rate_interval]))",
              "legendFormat": "{{status}}"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["gostalgia", "red"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "",
      "title": "gostalgia-api RED",
      "uid": "gostalgia-red",
      "version": 1
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: gostalgia-red-dashboard
  namespace: fury-monitoring
