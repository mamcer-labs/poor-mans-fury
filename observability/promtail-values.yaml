# Promtail 6.x reads the Loki client from config.clients. The install
# flags used in July (config.lokiAddress, config.snippets.extraClientConfigs)
# are ignored by this chart version, so every push went out without a
# tenant and Loki (auth_enabled: true) rejected it with 401 "no org id"
# until 18/11/2026.
# Promtail is EOL (02/03/2026): this file goes away with the move to Alloy
# (see alloy-values.yaml).
config:
  clients:
    - url: http://loki-gateway.fury-monitoring.svc.cluster.local/loki/api/v1/push
      tenant_id: poor-mans-fury
